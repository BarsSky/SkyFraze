# SkyFraze — production stack.
#
#   postgres  → данные (users/projects/events/assets/sessions)
#   backend   → Go API + Yjs WebSocket relay
#   frontend  → nginx + SPA + reverse-proxy /api → backend
#
# Запуск:
#   docker compose up --build
#   открыть http://localhost
#
# Health-checks и depends_on с condition: service_healthy гарантируют,
# что backend стартует после postgres, а frontend — после backend.

services:
  postgres:
    image: postgres:15-alpine
    container_name: skyfraze-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyfraze
      POSTGRES_PASSWORD: skyfraze_dev
      POSTGRES_DB: skyfraze
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # наружу не публикуем в проде, но удобно для локального dev
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyfraze -d skyfraze"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - skyfraze-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: skyfraze-backend:latest
    container_name: skyfraze-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://skyfraze:skyfraze_dev@postgres:5432/skyfraze?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or env}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost
      LISTEN: ":8080"
      APP_ENV: production
      # Администрирование развёртывания.
      # ADMIN_EMAILS — кто администратор (через запятую); права выдаются и уже
      # зарегистрированным, и тем, кто зарегистрируется позже. Если список пуст,
      # администратором становится первый зарегистрированный пользователь.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # REGISTRATION_MODE — стартовый режим, пока админ не поменял его в интерфейсе:
      # request (по заявке, по умолчанию) | open (любой может регистрироваться).
      REGISTRATION_MODE: ${REGISTRATION_MODE:-request}
      # ИИ-помощник. Локально удобнее всего Ollama на хост-машине:
      # AI_OLLAMA_URL=http://host.docker.internal:11434 (в Linux — адрес docker0).
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-}
      # Явный размер контекста для Ollama-подобных серверов (llama.cpp без него уходит
      # в бесконечную автоперезагрузку модели). 0 — не задавать.
      AI_OLLAMA_NUM_CTX: ${AI_OLLAMA_NUM_CTX:-0}
      AI_OPENAI_COMPAT_URL: ${AI_OPENAI_COMPAT_URL:-}
      # Свой ли это сервер (считает на своей машине): для него согласие не нужно.
      AI_OPENAI_COMPAT_LOCAL: ${AI_OPENAI_COMPAT_LOCAL:-false}
      AI_SECRET_KEY: ${AI_SECRET_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-10}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-}
      # Обновление: источник релизов и общий с хостом каталог заявок
      UPDATE_REPO: ${UPDATE_REPO:-}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      UPDATE_STATE_DIR: /app/update-state
    volumes:
      # uploaded assets persist between container restarts
      - assets:/app/storage
      - ./update-state:/app/update-state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - skyfraze-net
    # expose port только при необходимости прямого доступа к API
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: skyfraze-frontend:latest
    container_name: skyfraze-frontend
    restart: unless-stopped
    ports:
      # публичный порт — UI.
      # 80 — дефолтный для HTTP, удобно для localhost.
      # 5173 — алиас для совместимости с dev-режимом (где Vite слушал на 5173).
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - skyfraze-net

volumes:
  pgdata:
  assets:

networks:
  skyfraze-net:
    driver: bridge
