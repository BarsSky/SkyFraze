# SkyFraze frontend nginx — SPA + /api reverse-proxy.
#
# Логика:
#   /            → статический index.html (SPA fallback)
#   /assets/*    → статика из /usr/share/nginx/html/assets
#   /api/*       → proxy на backend (skyfraze-backend:8080)
#   /health      → 200 OK (для healthcheck контейнера)
#
# Так как SPA делает fetch('/api/...') (relative URL), нам не нужно CORS —
# nginx проксирует на тот же origin.

server {
    listen       80 default_server;
    server_name  _;

    # Запрещаем nginx редиректить POST /api/projects → /api/projects/ (он это делает по дефолту).
    # absolute_redirect off оставляет редиректы как relative, а off полностью их выключает.
    absolute_redirect off;
    server_tokens off;

    # Лимит тела запроса. По умолчанию nginx режет всё, что больше 1 МБ, и любая
    # обычная фотография давала 413 — из-за этого «файлы не добавлялись».
    # 256m (не 50m): столько же нужно импорту проекта — архив со всеми вложениями
    # (лимит бэкенда transfer.MaxBundleSize = 200 МБ) плюс накладные расходы multipart.
    client_max_body_size 256m;

    # index.html не кэшируем: иначе браузер держит старый бандл после пересборки.
    etag off;
    add_header Cache-Control "no-store" always;

    # Default root — статические файлы Vite (index.html, /assets/...).
    root   /usr/share/nginx/html;
    index  index.html;

    # Healthcheck контейнера — отдельный путь, не SPA.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Healthcheck самого API через nginx. Бэкенд отдаёт /health (без префикса
    # /api), поэтому проксируем именно на него — иначе был 404.
    location = /api/health {
        proxy_pass http://skyfraze-backend:8080/health;
        access_log off;
    }

    # API proxy — единый location, перехватывает и /api/X и /api/X/
    # Используем rewrite, чтобы нормализовать trailing slash — без него nginx редиректит.
    # proxy_pass без URI сохраняет оригинальный URL на upstream.
    location ~ ^/api(/.*)?$ {
        # Если путь пришёл без trailing slash — добавляем виртуально для upstream через rewrite,
        # но оригинальный путь сохраняем для backend.
        proxy_pass         http://skyfraze-backend:8080$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        # Поток ответа помощника (SSE). Без этого nginx копит ответ в буфере и отдаёт
        # его целиком в конце: человек не увидел бы ни одного куска, пока модель не
        # закончит — ровно то, от чего поток и спасает. Заголовок X-Accel-Buffering
        # сервер тоже отдаёт, но полагаться только на него нельзя: его понимает nginx,
        # а не любой посредник.
        proxy_buffering off;
        proxy_cache off;
    }

    # SPA fallback — все неизвестные пути отдают index.html, чтобы React Router
    # мог обрабатывать client-side роутинг.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Сжатие для статики.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Кэш для билдов с хэшем в имени (Vite делает это по умолчанию).
    location ~* \.(?:css|js|svg|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
}
