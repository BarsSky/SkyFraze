<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SkyFraze">
  <!--
    Знак SkyFraze: пламя, собранное из листьев книги.

    Два листа сходятся у корешка и расходятся кверху двумя острыми языками —
    это одновременно раскрытая книга и огонь. Ниже — блок страниц и чёрный
    корешок с очерком; листья сине-зелёные.

    Важно: тот же рисунок продублирован компонентом src/components/BrandMark.tsx
    (он рисуется рядом с названием). Меняя форму, правьте оба места.
  -->
  <defs>
    <linearGradient id="sf-leaf" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#5FE3C8" />
      <stop offset="45%" stop-color="#2FA79C" />
      <stop offset="100%" stop-color="#1A6A93" />
    </linearGradient>
    <linearGradient id="sf-pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FEBD6" />
      <stop offset="100%" stop-color="#49B9AC" />
    </linearGradient>
    <linearGradient id="sf-spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07090D" />
      <stop offset="50%" stop-color="#151A21" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>
  </defs>

  <!-- блок страниц: тонкая светлая полоса между листьями и корешком -->
  <path d="M9.4 22.6h13.2c.6 0 1 .4 1 1v1.2c0 .6-.4 1-1 1H9.4c-.6 0-1-.4-1-1v-1.2c0-.6.4-1 1-1z" fill="url(#sf-pages)" />

  <!-- листья: два острых языка, сходящихся у корешка -->
  <path
    d="M16 23.6H8.4c-1.2-4-1.5-8.2-.2-12.2C9.4 7.6 11.2 4.6 13.6 2.6c.1 2.8.9 5.1 2.4 7z"
    fill="url(#sf-leaf)"
  />
  <path
    d="M16 23.6h7.6c1.2-4 1.5-8.2.2-12.2-1.2-3.8-3-6.8-5.4-8.8-.1 2.8-.9 5.1-2.4 7z"
    fill="url(#sf-leaf)"
  />

  <!-- светлые внутренние поля страниц вдоль сгиба -->
  <path d="M14.8 12.2v10.4M17.2 12.2v10.4" stroke="#CFF7EC" stroke-width="0.7" stroke-linecap="round" opacity="0.35" />

  <!-- сгиб книги: тёмная линия от развилки к корешку -->
  <path d="M16 9.6v13.9" stroke="#0B0F14" stroke-opacity="0.6" stroke-width="1.3" stroke-linecap="round" />

  <!-- корешок: чёрный, с сине-зелёным очерком сверху -->
  <path d="M9.2 24.8h13.6c1.2 0 2.2 1 2.2 2.2s-1 2.2-2.2 2.2H9.2c-1.2 0-2.2-1-2.2-2.2s1-2.2 2.2-2.2z" fill="url(#sf-spine)" />
  <path d="M9.2 24.8h13.6c1.2 0 2.2 1 2.2 2.2" fill="none" stroke="#2FA79C" stroke-width="1" stroke-linecap="round" opacity="0.95" />
</svg>
