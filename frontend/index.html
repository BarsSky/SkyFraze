<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Тёмная схема по умолчанию: браузер красит фон ДО загрузки CSS, и вместо белой вспышки на
         перезагрузке видна та же тема, что и в приложении (0.80.0). -->
    <meta name="color-scheme" content="dark light" />
    <title>SkyFraze</title>
    <style>
      /* Заставка загрузки (0.80.0). Почему в HTML, а не в React: бандл грузится и исполняется
         секунды на телефоне, и всё это время экран был ЧЁРНЫМ — «перезагрузка долгая» была
         ощущением без признака жизни (замер: первый контент на 1,8 с, до этого пусто). Статичная
         разметка видна с первого байта; React заменяет её своим деревом при монтировании. */
      html,
      body {
        margin: 0;
        background: #0e1412;
        color: #e7efe9;
      }
      html[data-theme='light'] body {
        background: #f7f5ee;
        color: #22302a;
      }
      .boot {
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 10px;
        padding: 24px;
        font: 14px/1.5 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #0e1412;
        color: #e7efe9;
      }
      html[data-theme='light'] .boot {
        background: #f7f5ee;
        color: #22302a;
      }
      .boot__mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: rgba(127, 200, 160, 0.12);
      }
      .boot__title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .boot__note {
        margin: 0;
        opacity: 0.7;
      }
      .boot__spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(127, 200, 160, 0.25);
        border-top-color: #7fc8a0;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__spinner {
          animation: none;
        }
      }
    </style>
    <script>
      // Тема из localStorage до первой отрисовки: иначе у светлой темы была бы вспышка тёмной.
      try {
        var storedTheme = window.localStorage.getItem('skyfraze-theme')
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme
        }
      } catch (error) {
        /* приватный режим — оставляем тёмную */
      }
      // Аварийный выход: если бандл не догрузился (сеть оборвалась, статика недоступна), заставка
      // не должна оставаться вечным «крутящимся» экраном без объяснения.
      setTimeout(function () {
        var boot = document.querySelector('[data-boot]')
        if (!boot) return
        var hint = document.createElement('p')
        hint.className = 'boot__note'
        hint.setAttribute('data-boot-stuck', '')
        hint.textContent =
          'Долго не загружается. Проверьте связь и обновите страницу (F5 или потяните вниз).'
        boot.appendChild(hint)
      }, 15000)
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" data-boot role="status" aria-live="polite">
        <span class="boot__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" focusable="false" aria-hidden="true">
            <path
              fill="#7fc8a0"
              d="M12 2c1.6 3.2 3.6 5.2 6.8 6.8C15.6 10.4 13.6 12.4 12 15.6c-1.6-3.2-3.6-5.2-6.8-6.8C8.4 7.2 10.4 5.2 12 2Z"
            />
            <path
              fill="#7fc8a0"
              opacity="0.6"
              d="M6 14c.9 1.8 2.1 3 3.9 3.9C8.1 18.8 6.9 20 6 21.8c-.9-1.8-2.1-3-3.9-3.9C3.9 17 5.1 15.8 6 14Z"
            />
          </svg>
        </span>
        <p class="boot__title">SkyFraze</p>
        <p class="boot__note">Загружаю оболочку…</p>
        <div class="boot__spinner" aria-hidden="true"></div>
      </div>
    </div>
    <noscript>Для работы SkyFraze нужен JavaScript: включите его в настройках браузера.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
