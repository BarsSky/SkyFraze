name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skyfraze
          POSTGRES_PASSWORD: skyfraze_dev
          POSTGRES_DB: skyfraze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyfraze -d skyfraze_test"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://skyfraze:skyfraze_dev@localhost:5432/skyfraze_test?sslmode=disable
      JWT_SECRET: test-secret-for-ci
      STORAGE_DIR: /tmp/skyfraze-storage
      LISTEN: ":8181"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache-dependency-path: backend/go.sum }
      - run: cd backend && go mod download
      - run: cd backend && go vet ./...
      - run: cd backend && go test ./...
      # Ротация копий удаляет данные — проверка не требует базы и docker'а, зато ловит
      # ошибку в шаблонах имён до того, как она съест реальные копии на стенде.
      - run: bash deploy/backup.sh --self-test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npx vitest run

  # Контракт ObjectStore на НАСТОЯЩЕМ S3, а не на поддельном HTTP-сервере.
  #
  # Зачем отдельный job. `S3Store` — вторая реализация хранилища, и на ней лежат вложения
  # боевого стенда. Поддельный сервер в unit-тестах проверяет, что клиент послал то, что мы
  # думаем, и ничего не говорит о том, принимает ли это S3: расхождения вылезают в мелочах —
  # кодирование юникода в ключе, `Content-Type`, `Last-Modified` с точностью до секунды,
  # обрезка префикса стенда при листинге. Здесь `go test` гоняет один и тот же набор по
  # обеим реализациям (`conformance_test.go`), и вторая — живой S3 API.
  #
  # Почему не MinIO, хотя на стенде MinIO. В октябре 2025 MinIO перестал публиковать образы:
  # `minio/minio` удалён с Docker Hub, `quay.io/minio/minio` отвечает 401 без учётной записи.
  # Поэтому поднимается SeaweedFS — S3-совместимый сервер, который проверяет подпись
  # по-настоящему (без ключей объект не создать). Сам MinIO стенда проверяется живой
  # загрузкой файла — docs/storage-s3.md §11.
  storage-s3:
    runs-on: ubuntu-latest
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9010
      S3_TEST_ACCESS_KEY: confkey
      S3_TEST_SECRET_KEY: confsecret
      S3_TEST_BUCKET: skyfraze-conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache-dependency-path: backend/go.sum }
      - name: S3-сервер (SeaweedFS)
        run: |
          mkdir -p /tmp/s3conf
          cat > /tmp/s3conf/s3.json <<'JSON'
          {
            "identities": [
              {
                "name": "conformance",
                "credentials": [{"accessKey": "confkey", "secretKey": "confsecret"}],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
          JSON
          docker run -d --name s3 -p 9010:8333 \
            -v /tmp/s3conf/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:4.50 server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9010/; then echo "S3 готов"; exit 0; fi
            sleep 1
          done
          echo "S3 не поднялся:"; docker logs s3; exit 1
      - name: бакет для тестов
        run: |
          # Создание бакета повторяем: S3-порт отвечает чуть раньше, чем поднимается мастер
          # SeaweedFS, и первый `weed shell` может не достучаться. Ошибку setup лучше
          # показать здесь, чем «тест упал на NoSuchBucket».
          for i in $(seq 1 30); do
            if docker exec -i s3 sh -c \
              "echo 's3.bucket.create -name $S3_TEST_BUCKET' | weed shell -master=127.0.0.1:9333" 2>&1 \
              | grep -q "created bucket"; then
              echo "бакет создан"; exit 0
            fi
            sleep 2
          done
          echo "бакет не создан"; docker logs s3; exit 1
      # Контракт + вся остальная проверка пакета хранилища (подпись по вектору AWS,
      # страницы листинга, конфиг проверяется на старте).
      - run: cd backend && go test ./internal/storage/ -count=1 -v
      - name: лог S3 при падении
        if: failure()
        run: docker logs s3

  # Дымовые сценарии в браузере: чистый postgres + backend + vite (его поднимает
  # сам Playwright) и `npm run e2e`. Проверяем ровно то, чего не видно в unit-тестах:
  # первая регистрация на пустой инсталляции доводит до /projects, неверный пароль
  # показывает понятный текст, а защищённые страницы закрыты без входа.
  #
  # Отдельно от frontend-test: здесь нужны браузер, база и живой сервер, поэтому
  # job дольше и падает по другим причинам. Живые сценарии, которым нужен
  # конкретный стенд (`tests/*.ts` с вписанными адресами и учётками), в CI не
  # гоняются — они остаются инструментами разработчика.
  e2e:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skyfraze
          POSTGRES_PASSWORD: skyfraze_dev
          POSTGRES_DB: skyfraze_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyfraze -d skyfraze_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://skyfraze:skyfraze_dev@localhost:5432/skyfraze_e2e?sslmode=disable
      JWT_SECRET: e2e-secret
      STORAGE_DIR: /tmp/skyfraze-e2e-storage
      # Порт совпадает с target прокси в frontend/vite.config.ts.
      LISTEN: ":8181"
      CORS_ORIGINS: http://localhost:5173
      REGISTRATION_MODE: request
      # ИИ-помощник включён, но провайдер — заглушка на этом же раннере
      # (frontend/tests/e2e/stub-ollama.mjs): ни сети, ни ключей, ни денег, а путь
      # «сообщение → инструмент → кадр в проекте» проверяется целиком. Модель
      # считается локальной, поэтому согласие в сценарии не требуется.
      AI_ENABLED: "true"
      AI_OLLAMA_URL: http://127.0.0.1:11490
      # Ограничитель попыток входа выключен — только здесь и только для e2e.
      #
      # Причина: сценариев больше десяти, каждый входит тем же адресом с того же IP, и
      # `AUTH_LOGIN_PER_EMAIL_PER_MINUTE` (5 по умолчанию) начинает отвечать 429 на
      # законный вход. Симптом обманчив: падают не все сценарии, а «случайные», с
      # «неверный email или пароль» в разметке, то есть прогон выглядит нестабильным.
      # Сам ограничитель проверяется отдельно (internal/ratelimit и интеграционные тесты
      # auth) — здесь он не то, что мы тестируем, а то, что мешает.
      AUTH_RATE_PER_MINUTE: "0"
      AUTH_LOGIN_PER_EMAIL_PER_MINUTE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci --no-audit --no-fund
      # Браузер ставим с системными зависимостями: на голом ubuntu-latest Playwright
      # падает из-за отсутствующих библиотек.
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: заглушка провайдера модели
        run: |
          nohup node frontend/tests/e2e/stub-ollama.mjs > /tmp/stub-ollama.log 2>&1 &
          echo $! > /tmp/stub-ollama.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11490/api/tags > /dev/null; then
              echo "заглушка готова"
              exit 0
            fi
            sleep 1
          done
          echo "заглушка не поднялась:"; cat /tmp/stub-ollama.log; exit 1
      - name: backend в фоне
        run: |
          mkdir -p "$STORAGE_DIR"
          cd backend
          go build -o /tmp/skyfraze-server ./cmd/server
          # nohup: процесс должен пережить конец этого шага и работать, пока идут
          # сценарии. Лог читаем, если что-то пошло не так.
          nohup /tmp/skyfraze-server > /tmp/skyfraze-backend.log 2>&1 &
          echo $! > /tmp/skyfraze-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8181/health > /dev/null; then
              echo "backend готов"
              exit 0
            fi
            sleep 1
          done
          echo "backend не поднялся:"; cat /tmp/skyfraze-backend.log; exit 1
      - run: cd frontend && npx playwright test
      - name: лог backend при падении
        if: failure()
        run: cat /tmp/skyfraze-backend.log /tmp/stub-ollama.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results
          if-no-files-found: ignore

  build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd backend && go build -o bin/server ./cmd/server
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: skyfraze-build
          path: |
            backend/bin/server
            frontend/dist
