# SkyFraze — конфигурация для сервера (production-like).
#
# Отличия от docker-compose.yml (который рассчитан на локальную разработку):
#   * Postgres НЕ публикуется наружу. На сервере 5432 уже может быть занят
#     системным postgres, да и база не должна быть доступна извне;
#   * порт UI задаётся переменной SKYFRAZE_PORT (по умолчанию 80), чтобы можно
#     было увести приложение на другой порт, если 80 занят (например, mailcow);
#   * всё с restart: unless-stopped и без публикации отладочного порта 5173.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# .env рядом (см. .env.example):
#   JWT_SECRET=...            обязателен
#   ADMIN_EMAILS=you@example.com
#   REGISTRATION_MODE=request
#   SKYFRAZE_PORT=80

services:
  postgres:
    image: postgres:15-alpine
    container_name: skyfraze-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyfraze
      POSTGRES_PASSWORD: skyfraze_dev
      POSTGRES_DB: skyfraze
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyfraze -d skyfraze"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - skyfraze-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Версия и коммит попадают в бинарь и показываются в админке («Обновление»)
        VERSION: ${SKYFRAZE_VERSION:-dev}
        COMMIT: ${SKYFRAZE_COMMIT:-}
    image: skyfraze-backend:latest
    container_name: skyfraze-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://skyfraze:skyfraze_dev@postgres:5432/skyfraze?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      LISTEN: ":8080"
      APP_ENV: production
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-request}
      # Предел вложений проекта (после пережатия), байт; 0 — без предела.
      ASSET_QUOTA_BYTES: ${ASSET_QUOTA_BYTES:-10485760}
      # ИИ-помощник (docs/ai-assistant.md). Выключен по умолчанию: текст проекта
      # уходит на чужую машину только по осознанному решению оператора.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-}
      # Явный размер контекста для Ollama-подобных серверов (llama.cpp без него уходит
      # в бесконечную автоперезагрузку модели). 0 — не задавать.
      AI_OLLAMA_NUM_CTX: ${AI_OLLAMA_NUM_CTX:-0}
      AI_OPENAI_COMPAT_URL: ${AI_OPENAI_COMPAT_URL:-}
      # Свой ли это сервер (считает на своей машине): для него согласие не нужно.
      AI_OPENAI_COMPAT_LOCAL: ${AI_OPENAI_COMPAT_LOCAL:-false}
      AI_SECRET_KEY: ${AI_SECRET_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-10}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      AI_TOKENS_PER_DAY: ${AI_TOKENS_PER_DAY:-0}
      # Ключи стенда к размещённым провайдерам (необязательны: без них работают
      # локальная модель и ключи самих пользователей)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-}
      # Механизм обновления: откуда брать релизы и где общий с хостом каталог заявок
      UPDATE_REPO: ${UPDATE_REPO:-}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      UPDATE_STATE_DIR: /app/update-state
    volumes:
      - assets:/app/storage
      # Каталог состояния обновления: админка пишет request.json, хост-скрипт —
      # status.json и update.log (см. deploy/skyfraze-update.sh)
      - ./update-state:/app/update-state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - skyfraze-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: skyfraze-frontend:latest
    container_name: skyfraze-frontend
    restart: unless-stopped
    ports:
      - "${SKYFRAZE_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - skyfraze-net

  # Локальная модель (Ollama) — ЕДИНСТВЕННЫЙ вариант «бесплатно и без ключа»:
  # считает на машине стенда, текст проекта никуда не уходит.
  #
  # Намеренно НЕ включена и закомментирована, а не спрятана в профиль: обычное
  # обновление не должно тянуть гигабайты образа и занимать память. Эта подсказка
  # живёт в репозитории специально — compose приезжает из него и перезаписывается
  # обновлением, поэтому локальная правка файла на стенде была бы потеряна.
  #
  # Как включить (нужен запас памяти: 7B в 4-битном квантовании просит ~5 ГБ,
  # маленькие 1–3B — 1–2 ГБ; на слабой машине модель будет отвечать медленно):
  #
  #   1. раскомментировать сервис ниже;
  #   2. в .env добавить AI_OLLAMA_URL=http://ollama:11434;
  #   3. docker compose -f docker-compose.prod.yml up -d
  #      docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen2.5:3b
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: skyfraze-ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama:/root/.ollama
  #   networks:
  #     - skyfraze-net

volumes:
  pgdata:
  assets:

networks:
  skyfraze-net:
    driver: bridge
